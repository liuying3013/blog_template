name: Validate, Build and Deploy

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE_NAME: ghcr.io/your-org/example-site

jobs:
  validate:
    name: Validate Content and Build Site
    # 只作为 PR 质量门禁运行。
    # push 到 main 时，Docker 构建内部会执行同样的检查与构建。
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check Astro and TypeScript
        run: npm run check

      - name: Validate content
        run: npm run validate:content

      - name: Lint
        run: npm run lint --if-present

      - name: Test
        run: npm test --if-present

      - name: Build static site
        run: npm run build
        env:
          SITE_URL: ${{ vars.SITE_URL }}
          PUBLIC_WHATSAPP_NUMBER: ${{ vars.PUBLIC_WHATSAPP_NUMBER }}
          PUBLIC_WHATSAPP_NUMBER_AR: ${{ vars.PUBLIC_WHATSAPP_NUMBER_AR }}
          PUBLIC_WHATSAPP_NUMBER_PL: ${{ vars.PUBLIC_WHATSAPP_NUMBER_PL }}
          PUBLIC_GTM_ID: ${{ vars.PUBLIC_GTM_ID }}

  build_image:
    name: Build and Push Docker Image
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image_ref: ${{ steps.image_ref.outputs.image_ref }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            SITE_URL=${{ vars.SITE_URL }}
            BUILD_SHA=${{ github.sha }}
            PUBLIC_WHATSAPP_NUMBER=${{ vars.PUBLIC_WHATSAPP_NUMBER }}
            PUBLIC_WHATSAPP_NUMBER_AR=${{ vars.PUBLIC_WHATSAPP_NUMBER_AR }}
            PUBLIC_WHATSAPP_NUMBER_PL=${{ vars.PUBLIC_WHATSAPP_NUMBER_PL }}
            PUBLIC_GTM_ID=${{ vars.PUBLIC_GTM_ID }}
          tags: |
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.IMAGE_NAME }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Generate immutable image reference
        id: image_ref
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          echo \
            "image_ref=${IMAGE_NAME}@${IMAGE_DIGEST}" \
            >> "$GITHUB_OUTPUT"

  deploy:
    name: Deploy Production
    if: github.event_name != 'pull_request'
    needs:
      - build_image
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ vars.SITE_URL }}
    concurrency:
      group: example-site-production
      cancel-in-progress: false
    permissions:
      contents: read
    steps:
      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY:
            ${{ secrets.PROD_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS:
            ${{ secrets.PROD_SSH_KNOWN_HOSTS }}
        run: |
          install -m 700 -d "$HOME/.ssh"

          printf '%s\n' "$SSH_PRIVATE_KEY" \
            > "$HOME/.ssh/id_ed25519"

          chmod 600 "$HOME/.ssh/id_ed25519"

          printf '%s\n' "$SSH_KNOWN_HOSTS" \
            > "$HOME/.ssh/known_hosts"

          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Deploy immutable image
        env:
          PROD_HOST: ${{ secrets.PROD_HOST }}
          PROD_PORT: ${{ secrets.PROD_PORT }}
          PROD_USER: ${{ secrets.PROD_USER }}
          IMAGE_REF:
            ${{ needs.build_image.outputs.image_ref }}
          BUILD_SHA:
            ${{ github.sha }}
        run: |
          ssh \
            -i "$HOME/.ssh/id_ed25519" \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -p "$PROD_PORT" \
            "${PROD_USER}@${PROD_HOST}" \
            "sudo /usr/local/sbin/example-site-deploy '${IMAGE_REF}' '${BUILD_SHA}'"

      - name: Purge Cloudflare cache
        env:
          CF_ZONE_ID:
            ${{ secrets.CF_ZONE_ID }}
          CF_API_TOKEN:
            ${{ secrets.CF_CACHE_PURGE_TOKEN }}
        run: |
          RESPONSE="$(
            curl \
              --fail \
              --silent \
              --show-error \
              --retry 3 \
              --request POST \
              "https://api.cloudflare.com/client/v4/zones/${CF_ZONE_ID}/purge_cache" \
              --header "Authorization: Bearer ${CF_API_TOKEN}" \
              --header "Content-Type: application/json" \
              --data '{"purge_everything":true}'
          )"

          echo "$RESPONSE" \
            | jq -e '.success == true'

      - name: Verify public health
        env:
          SITE_URL: ${{ vars.SITE_URL }}
          BUILD_SHA: ${{ github.sha }}
        run: |
          curl \
            --fail \
            --silent \
            --show-error \
            --retry 6 \
            --retry-all-errors \
            "${SITE_URL}/healthz"

          BUILD_META="$(
            curl \
              --fail \
              --silent \
              --show-error \
              --retry 6 \
              --retry-all-errors \
              "${SITE_URL}/_meta/build.json?revision=${BUILD_SHA}"
          )"

          echo "$BUILD_META" \
            | jq -e \
                --arg revision "$BUILD_SHA" \
                '.revision == $revision'
