# docker/site.conf
server {
    listen 8080;
    listen [::]:8080;

    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    charset utf-8;
    server_tokens off;
    etag on;

    access_log /dev/stdout;
    error_log /dev/stderr warn;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/xml
        application/json
        application/javascript
        application/xml
        application/rss+xml
        image/svg+xml;

    location = /healthz {
        access_log off;
        default_type text/plain;
        add_header Cache-Control
            "no-store"
            always;
        return 200 "ok\n";
    }

    location = /_meta/build.json {
        try_files $uri =404;
        add_header Cache-Control
            "no-store"
            always;
    }

    location /_astro/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control
            "public, max-age=31536000, immutable"
            always;
    }

    location /images/ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control
            "public, max-age=2592000"
            always;
    }

    location ~* ^/(?:robots\.txt|rss\.xml|sitemap.*\.xml)$ {
        try_files $uri =404;
        add_header Cache-Control
            "public, max-age=300, must-revalidate"
            always;
    }

    location ~ /\.(?!well-known) {
        deny all;
    }

    # trailingSlash: "always" 的配套规则：
    # 不带斜杠且不含扩展名的路径 301 到带斜杠版本，
    # 避免 /blog/post 与 /blog/post/ 同时返回 200 造成重复内容。
    # $is_args$args 保留 UTM 等查询参数。
    # /healthz 为精确匹配（location =），优先级更高，不受影响。
    location ~ ^([^.]*[^/])$ {
        return 301 $1/$is_args$args;
    }

    location / {
        try_files
            $uri
            $uri/
            $uri/index.html
            =404;
        add_header Cache-Control
            "public, max-age=0, must-revalidate"
            always;
    }

    error_page 404 /404.html;

    location = /404.html {
        internal;
    }
}
